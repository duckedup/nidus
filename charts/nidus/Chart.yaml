apiVersion: v2
name: nidus
description: |
  A small, pure-Rust vector store served over HTTP. This chart runs `nidus serve`
  backed by shared, non-local storage — an object store (S3/GCS) for durable bytes
  and a Redis-family tier for the working set — the configuration a container needs
  since it has no durable local disk.
type: application

# BOTH versions below are STAMPED BY CI from the crate version at release time
# (.github/workflows/helm-publish.yml, nidus-yap) — do not hand-edit them, and do not
# expect a PR that bumps Cargo.toml to touch this file. They are checked in only so a
# clone renders, and the release job commits the stamp back to keep them honest.
#
# They are equal on purpose. An OCI registry keys a chart solely by `version`, so a new
# `appVersion` (the image tag a default install deploys) cannot reach anyone unless the
# chart version moves with it — tying them together is what makes "the published chart
# deploys the current nidus" true by construction rather than by remembering.
version: 0.5.1
appVersion: "0.36.0"

home: https://nidus.duckedup.org
sources:
  - https://github.com/duckedup/nidus
keywords:
  - vector
  - embeddings
  - search
  - vector-database
  - semantic-search
maintainers:
  - name: duckedup
    url: https://github.com/duckedup
