name: Release

on:
  push:
    branches: [main]

# Serialized (#124): a merge train pushes several bump commits minutes apart, and
# concurrent runs raced the tag — one failed mid-publish and which commit the v0.55.3
# artifacts came from was scheduler timing. Queued runs make the tag check deterministic.
concurrency:
  group: release
  cancel-in-progress: false

# The UNION of everything this workflow and every workflow it calls needs. A called
# workflow's job cannot hold more permission than the caller's token grants, and GitHub
# does not degrade gracefully when it asks for more — it refuses to start the entire run
# with a `startup_failure`, before any job or log exists. That is silent in the worst way:
# no failed job, no annotation, and `git tag` simply never happens, so a release looks
# like it was skipped rather than broken.
#
# It bit twice. `packages: write` (publish-helm, pushing the OCI chart to ghcr.io) landed
# without this widening and took out v0.37.0; `id-token: write` (publish-sdk-js, npm OIDC
# trusted publishing) then did the same to v0.38.0 and v0.39.0.
#
# So: adding a `uses:` job here means checking what permissions that workflow's jobs
# declare and adding them below. `docker.yml` needs nothing extra only because its job
# inherits rather than declaring its own.
permissions:
  contents: write # tag + GitHub release; the SDK stamp commits
  packages: write # publish-helm -> ghcr.io OCI chart
  id-token: write # publish-sdk-js -> npm OIDC trusted publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check for version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          TAG="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will release"
          fi

  # Build the `nidus` binary (the `serve` feature = `cli` + the full AI-ingest
  # layer) for each target and upload it as a release artifact. `serve` (not bare
  # `cli`) is what ships so `cargo binstall` / Docker users get the text-native
  # `/remember` + `/recall` endpoints out of the box. Asset names are
  # `nidus-<target>.tar.gz` (`.zip` on Windows), each holding the bare `nidus`
  # binary — matching `[package.metadata.binstall]` so `cargo binstall nidus`
  # resolves them. The library itself stays pure; only this opt-in feature pulls
  # the clap/tokio/axum + reqwest stack.
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the channel, so the in-repo build uses that
      # toolchain — not the one dtolnay just set up. Add the cross target to the
      # *active* (pinned) toolchain so its std is present (e.g. x86_64-apple-darwin
      # std on an Apple-Silicon runner). `cross` provides std itself, so skip it.
      - name: Add target to the pinned toolchain
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --features serve --target ${{ matrix.target }}

      - name: Build with cargo
        if: "!matrix.use_cross"
        run: cargo build --release --features serve --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../nidus-${{ matrix.target }}.tar.gz nidus
          cd ../../..
          # A sidecar checksum the installer verifies. `shasum` ships on both
          # macOS and Ubuntu runners.
          shasum -a 256 "nidus-${{ matrix.target }}.tar.gz" > "nidus-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/nidus.exe" -DestinationPath "nidus-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "nidus-${{ matrix.target }}.zip").Hash.ToLower()
          "$hash  nidus-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "nidus-${{ matrix.target }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: nidus-${{ matrix.target }}.*

  # The library is published to crates.io; the binaries above ride the GitHub
  # release. `cargo publish` verifies with default features, so it never compiles
  # the optional cli stack.
  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Publish
        run: |
          OUTPUT=$(cargo publish 2>&1) && exit 0
          if echo "$OUTPUT" | grep -q "already exists"; then
            echo "Version already published to crates.io, skipping"
          else
            echo "$OUTPUT"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [check-version, build-binaries, publish-crate]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--list 'v*'` restricts this to the crate's own tags. The SDKs tag in their
          # own namespaces (js-v*, py-v*, sdks/go/v*), and an unfiltered listing would
          # let one of those become PREV_TAG and silently truncate the crate changelog.
          # `|| true` because `grep -v` exits 1 when it filters everything out. This
          # step does not run under `set -e`, so today that only yields an empty
          # PREV_TAG — which the branch below already handles. Hardened anyway: the
          # identical line in sdk-go-release.yml *does* run under `set -euo pipefail`
          # and silently killed v0.40.0's Go SDK release, and a line that is only
          # accidentally safe is a poor thing to copy from.
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${{ needs.check-version.outputs.tag }}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi

          gh release create "${{ needs.check-version.outputs.tag }}" \
            nidus-*.tar.gz nidus-*.zip nidus-*.sha256 \
            --title "${{ needs.check-version.outputs.tag }}" \
            --latest \
            --notes "## nidus ${{ needs.check-version.outputs.version }}

          As a library:

          \`\`\`sh
          cargo add nidus@${{ needs.check-version.outputs.version }}
          \`\`\`

          As a CLI / server binary:

          \`\`\`sh
          cargo binstall nidus              # prebuilt binary (incl. memory endpoints)
          cargo install nidus --features serve   # from source (server + memory)
          \`\`\`

          ### Changes

          $NOTES"

  # The tag above is pushed with GITHUB_TOKEN, which cannot trigger the Docker
  # workflow on its own (the anti-recursion rule). So call it directly here, once a
  # release has actually been cut, to build and push the matching image.
  publish-docker:
    name: Publish Docker image
    needs: [check-version, github-release]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  # Same reasoning as publish-docker, plus one of its own: the chart's `appVersion` is
  # the image tag a default `helm install` deploys, so it must not be stamped until the
  # image it names actually exists. Hence `needs: publish-docker` — a chart pointing at
  # an unpublished tag would render fine and fail at pull time, which is the worst place
  # to find out (nidus-yap).
  publish-helm:
    name: Publish Helm chart
    needs: [check-version, publish-docker]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    uses: ./.github/workflows/helm-publish.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  # Every client SDK ships at the crate's version, so "which nidus does this client
  # speak to" is answerable from the version alone. Called from here for the same two
  # reasons as publish-docker/publish-helm: the tag above is pushed with GITHUB_TOKEN
  # and so cannot trigger a workflow of its own, and invoking directly makes it
  # structurally impossible for an SDK to publish a version the crate never released.
  #
  # `needs: github-release` (not just check-version) so an SDK is never published for a
  # release that failed to cut — and, for Go, because its module tag is cut from the
  # crate's release tag. The SDKs are independent of each other and run in parallel; one
  # registry being down must not block the others — hence the deliberately identical
  # `needs:`/`if:` on each of them rather than a chain. Each owns its release workflow,
  # since "publish" means something different per ecosystem (an npm/PyPI upload vs. a
  # bare module tag).
  publish-sdk-js:
    name: Publish JS SDK
    needs: [check-version, github-release]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    uses: ./.github/workflows/sdk-js-release.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  publish-sdk-go:
    name: Publish Go SDK
    needs: [check-version, github-release]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    uses: ./.github/workflows/sdk-go-release.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  publish-sdk-py:
    name: Publish Python SDK
    needs: [check-version, github-release]
    if: "!failure() && !cancelled() && needs.check-version.outputs.should_release == 'true'"
    uses: ./.github/workflows/sdk-py-release.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit
