name: Helm chart

# Lint and render the chart on every change. PUBLISHING lives in helm-publish.yml,
# which release.yml calls once a release is actually cut — see that file for why the
# chart's versions are stamped from the crate rather than hand-edited (nidus-yap).
# Users install with:
#   helm install nidus oci://ghcr.io/duckedup/charts/nidus --version <x.y.z>
on:
  push:
    branches: [main]
    paths: ["charts/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["charts/**", ".github/workflows/helm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # No appVersion-vs-crate assertion here any more. It used to live at this step and
      # it worked — but since every PR bumps `Cargo.toml`, it fired on essentially every
      # PR, and it fired late, in CI after a push. helm-publish.yml now derives both chart
      # versions from the crate at release time, so the drift it guarded against is
      # unrepresentable rather than merely detected. `Cargo.toml` has left this workflow's
      # trigger paths for the same reason: a crate bump alone no longer changes anything
      # here.
      - name: helm lint
        run: helm lint charts/nidus --values charts/nidus/ci/test-values.yaml

      - name: helm template (render must succeed and be valid YAML)
        run: |
          helm template nidus charts/nidus \
            --values charts/nidus/ci/test-values.yaml > /tmp/rendered.yaml
          # Catch obviously-broken manifests beyond what `helm lint` checks.
          docker run --rm -i ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas < /tmp/rendered.yaml

      - name: Render must FAIL fast without required values
        run: |
          if helm template nidus charts/nidus >/dev/null 2>&1; then
            echo "expected render to fail without nidus.dim/persistence/memory" >&2
            exit 1
          fi
          echo "ok: chart rejects an incomplete config"
