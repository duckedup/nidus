name: Integration

# End-to-end tests against a REAL running system: the `nidus serve` binary driven
# over a real socket, and several instances clustered over a real object store
# (minio) and a real Redis-family memory tier (valkey).
#
# Its own workflow, not a lane in ci.yml, for two reasons: it is the only job that
# needs Docker services, and keeping it separate means `ci.yml` stays a statement
# about the pure library + feature lanes — fast, service-free, and unaffected by a
# container hiccup.
#
# Both jobs here are REQUIRED status checks on pull requests, and required checks
# must also run on merge_group or a queued PR stalls waiting for a report that
# never comes.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  e2e:
    name: e2e (real server + cluster over minio/valkey)
    runs-on: ubuntu-latest
    # Generous next to the ~30s of real work, but bounded: a hung server or a
    # service that never comes up must fail the check rather than burn an hour.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Same cache shape as ci.yml's matrix jobs, with its own key so it neither
      # evicts nor is evicted by them.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      # Build before starting anything, so a compile error reads as a compile
      # error instead of a confusing "server never reported an address".
      # The embed/summarize features gate suites driven by hand-rolled TCP mocks — no
      # real services — so leaving them off would silently compile them away (#111).
      - name: Build the test binary and the nidus binary
        run: cargo test --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai --test e2e --no-run

      # Started via the same script `just e2e-services-up` runs, so a developer
      # reproducing a CI failure gets a byte-identical environment. Not GitHub
      # `services:` containers: those cannot pass a command to the image, and
      # minio needs `server /data`. The script waits for real readiness
      # (minio /health/live, valkey PING) rather than sleeping.
      - name: Start minio + valkey + fake-gcs-server
        run: ./scripts/e2e-services.sh up

      # --include-ignored runs the cluster suite (#[ignore]d because it needs the
      # services above) alongside the service-free server suite, so this job is a
      # complete statement about e2e health on its own. The server suite also runs
      # in ci.yml's `test` job (its `cli` step); the few seconds of overlap are worth
      # not having this check depend on another workflow.
      #
      # The tests' NIDUS_E2E_* defaults already match what the script starts, so
      # there is nothing to configure here — one less pair of values to drift.
      # NIDUS_E2E_GCS_ENDPOINT opts the gs:// lane in — without it that one test
      # skips itself, so the suite stays green for a developer without the emulator.
      - name: Run end-to-end tests
        run: cargo test --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai --test e2e -- --include-ignored --test-threads=2
        env:
          NIDUS_E2E_GCS_ENDPOINT: http://127.0.0.1:4650

      # Second leg: the same cluster suite against a 3-master Valkey CLUSTER, which
      # is the only way the tier client's slot routing and MOVED/ASK handling get
      # exercised — a single-node valkey never issues a redirect. Same tests, driven
      # purely by NIDUS_E2E_REDIS_URL, so there is no second copy to maintain.
      # Linux-only (needs real host networking), which is exactly what this runner is.
      - name: Start Valkey Cluster
        run: ./scripts/e2e-services.sh up-cluster

      - name: Run cluster tests against Valkey Cluster
        run: |
          NIDUS_E2E_REDIS_URL="$(./scripts/e2e-services.sh cluster-url)" \
            cargo test --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai --test e2e cluster:: -- --ignored --test-threads=2

      # A red run should be diagnosable from the log alone, without a rerun. The
      # harness already attaches each nidus process's stderr to its failure; these
      # are the backing services' side of the story.
      - name: Service logs (on failure)
        if: failure()
        run: |
          echo "::group::minio"
          docker logs nidus-e2e-minio 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::valkey"
          docker logs nidus-e2e-valkey 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::fake-gcs-server"
          docker logs nidus-e2e-gcs 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::valkey cluster"
          for c in nidus-e2e-valkey-c0 nidus-e2e-valkey-c1 nidus-e2e-valkey-c2; do
            echo "--- $c"; docker logs "$c" 2>&1 | tail -40 || true
          done
          docker exec nidus-e2e-valkey-c0 valkey-cli -p 7100 cluster info 2>&1 | head -20 || true
          echo "::endgroup::"
          echo "::group::stray nidus processes"
          pgrep -af "nidus serve" || echo "none (harness cleaned up)"
          echo "::endgroup::"

      - name: Stop services
        if: always()
        run: |
          ./scripts/e2e-services.sh down
          ./scripts/e2e-services.sh down-cluster
