name: Integration

# End-to-end tests against a REAL running system: the `nidus serve` binary driven
# over a real socket, and several instances clustered over a real object store
# (minio) and a real Redis-family memory tier (valkey).
#
# Its own workflow, not a lane in ci.yml, for two reasons: it is the only job that
# needs Docker services, and keeping it separate means `ci.yml` stays a statement
# about the pure library + feature lanes — fast, service-free, and unaffected by a
# container hiccup.
#
# Both jobs here are REQUIRED status checks on pull requests, and required checks
# must also run on merge_group or a queued PR stalls waiting for a report that
# never comes.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # See ci.yml: in the queue this check reports without re-running, since the tree it
  # would test is the one the PR already tested. Guarded per STEP so it still reports.
  # SKIP_LANE is the PR-time analogue — see the Lane guard step and ci.yml's env note.
  QUEUE_LITE: ${{ github.event_name == 'merge_group' }}

jobs:
  e2e:
    name: e2e (real server + cluster over minio/valkey)
    runs-on: ubuntu-latest
    # Generous next to the ~30s of real work, but bounded: a hung server or a
    # service that never comes up must fail the check rather than burn an hour.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Lane guard — skip the work when no changed path exercises this job
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" HEAD | paste -sd, -)"
          if [ -n "$files" ] && [ "$(.claude/skills/nidus/bin/nidus-check ci-guard e2e --paths "$files")" = "skip" ]; then
            echo "SKIP_LANE=true" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}

      # Same cache shape as ci.yml's matrix jobs, with its own key so it neither
      # evicts nor is evicted by them.
      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      # Build before starting anything, so a compile error reads as a compile
      # error instead of a confusing "server never reported an address".
      # The embed/summarize features gate suites driven by hand-rolled TCP mocks — no
      # real services — so leaving them off would silently compile them away (#111).
      - name: Build the test binary and the nidus binary
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: cargo test --no-default-features --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai,rerank-cohere --test e2e --no-run

      # Started via the same script `just e2e-services-up` runs, so a developer
      # reproducing a CI failure gets a byte-identical environment. Not GitHub
      # `services:` containers: those cannot pass a command to the image, and
      # minio needs `server /data`. The script waits for real readiness
      # (minio /health/live, valkey PING) rather than sleeping.
      - name: Start minio + valkey + fake-gcs-server
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-services.sh up

      # --include-ignored runs the cluster suite (#[ignore]d because it needs the
      # services above) alongside the service-free server suite, so this job is a
      # complete statement about e2e health on its own. The server suite also runs
      # in ci.yml's `test` job (its `cli` step); the few seconds of overlap are worth
      # not having this check depend on another workflow.
      #
      # The tests' NIDUS_E2E_* defaults already match what the script starts, so
      # there is nothing to configure here — one less pair of values to drift.
      # NIDUS_E2E_GCS_ENDPOINT opts the gs:// lane in — without it that one test
      # skips itself, so the suite stays green for a developer without the emulator.
      - name: Run end-to-end tests
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: cargo test --no-default-features --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai,rerank-cohere --test e2e -- --include-ignored --test-threads=2
        env:
          NIDUS_E2E_GCS_ENDPOINT: http://127.0.0.1:4650

      # Second leg: the same cluster suite against a 3-master Valkey CLUSTER, which
      # is the only way the tier client's slot routing and MOVED/ASK handling get
      # exercised — a single-node valkey never issues a redirect. Same tests, driven
      # purely by NIDUS_E2E_REDIS_URL, so there is no second copy to maintain.
      # Linux-only (needs real host networking), which is exactly what this runner is.
      - name: Start Valkey Cluster
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-services.sh up-cluster

      - name: Run cluster tests against Valkey Cluster
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: |
          NIDUS_E2E_REDIS_URL="$(./scripts/e2e-services.sh cluster-url)" \
            cargo test --no-default-features --features cli,mcp,embed-ollama,embed-openai-compat,summarize-openai,rerank-cohere --test e2e cluster:: -- --ignored --test-threads=2

      # A red run should be diagnosable from the log alone, without a rerun. The
      # harness already attaches each nidus process's stderr to its failure; these
      # are the backing services' side of the story.
      - name: Service logs (on failure)
        if: ${{ failure() && env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: |
          echo "::group::minio"
          docker logs nidus-e2e-minio 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::valkey"
          docker logs nidus-e2e-valkey 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::fake-gcs-server"
          docker logs nidus-e2e-gcs 2>&1 | tail -100 || true
          echo "::endgroup::"
          echo "::group::valkey cluster"
          for c in nidus-e2e-valkey-c0 nidus-e2e-valkey-c1 nidus-e2e-valkey-c2; do
            echo "--- $c"; docker logs "$c" 2>&1 | tail -40 || true
          done
          docker exec nidus-e2e-valkey-c0 valkey-cli -p 7100 cluster info 2>&1 | head -20 || true
          echo "::endgroup::"
          echo "::group::stray nidus processes"
          pgrep -af "nidus serve" || echo "none (harness cleaned up)"
          echo "::endgroup::"

      - name: Stop services
        if: ${{ always() && env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: |
          ./scripts/e2e-services.sh down
          ./scripts/e2e-services.sh down-cluster

  # nidus-y67: the real behavioural check for the wasm32 target. Both runtime
  # hazards (the clock read, `thread::scope`) compile cleanly, so `ci.yml`'s
  # `wasm` job (build + clippy only) has no failing mode for them — this job
  # actually executes the suites: `just test-wasm` under Node (clock, thread
  # degradation, ranking), then the `wasm_opfs` target in a real headless
  # browser, since OPFS does not exist outside one.
  wasm-e2e:
    name: wasm-e2e (Node + real headless browser)
    runs-on: ubuntu-latest
    # Generous next to toolchain install + browser startup, but bounded so a
    # hung browser fails the check instead of burning an hour.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Lane guard — skip the work when no changed path exercises this job
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" HEAD | paste -sd, -)"
          if [ -n "$files" ] && [ "$(.claude/skills/nidus/bin/nidus-check ci-guard wasm-e2e --paths "$files")" = "skip" ]; then
            echo "SKIP_LANE=true" >> "$GITHUB_ENV"
          fi


      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}

      # Needed by the `docs` mode of scripts/e2e-wasm.sh: it builds docs/ (bun
      # install + astro build) and drives docs/e2e/terminal.mjs via bun.
      - name: Setup Bun
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOT the action's `targets:` input. `rust-toolchain.toml` pins 1.98.0, so every
      # cargo call resolves there while `targets:` would add wasm32 to `stable` instead,
      # and the build would fail with "can't find crate for `core`". `rustup target add`
      # honours the toolchain-file override, so it lands on whatever cargo actually uses.
      - name: Add the wasm32 target to the pinned toolchain
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Ensure `just` is available
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: command -v just >/dev/null 2>&1 || cargo install just --locked

      # Own cache key, same shape as the other jobs, so it neither evicts nor
      # is evicted by them.
      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-e2e-

      # Pins wasm-bindgen-cli to 0.2.122 (must match Cargo.lock's wasm-bindgen)
      # and locates the ubuntu runner's preinstalled chromedriver; on failure
      # it names the unusable case rather than hanging (macOS only, not this runner).
      - name: Bring up the wasm-bindgen runner + browser driver
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-wasm.sh up

      - name: Node suite (clock, thread degradation, ranking)
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: just test-wasm

      # OPFS only exists in a browser, so this is the only place the handle
      # pool is actually exercised; a Node-only lane could not prove it.
      - name: Browser suite (wasm_opfs, real headless browser)
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-wasm.sh test

      # Builds the docs site (which embeds the wasm binding) and drives a real
      # terminal demo over OPFS in the same browser, so a stale demo fails here
      # rather than silently shipping (nidus-7pj).
      - name: Docs terminal E2E (OPFS demo, real headless browser)
        if: ${{ env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-wasm.sh docs

      - name: Clean up
        if: ${{ always() && env.QUEUE_LITE != 'true' && env.SKIP_LANE != 'true' }}
        run: ./scripts/e2e-wasm.sh down
