name: CI

# merge_group is not optional once the queue is on: a queued PR is built on a
# temporary gh-readonly-queue ref, and a required check that does not run there
# never reports, so the entry stalls until it is ejected.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large and single-run-only — they just bloat the
  # cache. CI builds clean each run, so disable incremental compilation.
  CARGO_INCREMENTAL: "0"
  # The queue rebuilds to catch PRs that are green alone but broken together, which only a
  # compile of the merged tree can see; everything else re-runs identical work against an
  # identical tree. `test` and `Miri` are in the second group on purpose — they are the two
  # slowest lanes, and the queue's entries are serialized, so their cost is paid per entry
  # while `clippy` + `release` already compile every feature set of the combined tree.
  # Guarded per STEP, never by a job-level `if`: a required check must still report.
  QUEUE_LITE: ${{ github.event_name == 'merge_group' }}

jobs:
  # Formatting is a no-compile check — keep it as its own fast job.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The build budget, enforced (#95): the thesis is a seconds-long clean build, and an
  # unenforced thesis drifts. Deps are fetched first so network time is not counted, and
  # there is deliberately NO cache — the claim is about a CLEAN build. The 60s bound is
  # order-of-magnitude (measured ~7s locally; same rule as tests/e2e/scale.rs timings):
  # loose enough for a shared runner, tight enough that a bundled-C tree cannot pass.
  build-budget:
    name: build-budget (clean-build timer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' }}
      - name: Fetch dependencies (network time is not compile time)
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: cargo fetch
      - name: Time a clean offline build of the default features
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: |
          start=$(date +%s)
          cargo build --offline
          elapsed=$(( $(date +%s) - start ))
          echo "clean build: ${elapsed}s (budget: 60s, SPEC §1)"
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::clean build took ${elapsed}s — over the 60s budget (SPEC §1). A new dependency likely blew the build-and-ship thesis; this is a design change, not an implementation detail."
            exit 1
          fi

  # clippy, test, and the release build are separate compiles (check-mode vs
  # build-mode artifacts vs the release profile), so they stay parallel jobs with a
  # cache slot each. Within a job the feature sets share one `target`, which is why
  # collapsing them costs latency but not much CPU.
  #
  # One job per kind of check, each covering every feature set as its own named step
  # (#189). The names `clippy` and `test` are load-bearing: `main`'s ruleset requires
  # them, so a required `test` now genuinely runs the CLI, server and ingest layers
  # rather than the pure library alone.
  #
  # Feature sets: the default build is the pure, FFI-free library. `cli` adds the binary
  # deps (clap + tokio/axum). `serve` is the shipped binary (`cli` plus the full ingest
  # layer's routes). The last adds the off-by-default AI ingest edge (reqwest → hyper →
  # rustls/ring). Miri stays on its own job below: it can run neither async edge.
  #
  # Steps carry `if: !cancelled()` so one run reports every broken feature set instead of
  # stopping at the first, which is what `fail-fast: false` bought across the old matrix.
  # A failed step still fails the job.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: pure library (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: cli
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: serve
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features serve -- -D warnings
      - name: ingest
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features memory,embed-all,summarize-all,rerank-all -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' }}

      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: pure library (default features)
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: cargo test
      - name: cli
        if: ${{ !cancelled() && env.QUEUE_LITE != 'true' }}
        run: cargo test --features cli
      - name: serve
        if: ${{ !cancelled() && env.QUEUE_LITE != 'true' }}
        run: cargo test --features serve
      - name: ingest
        if: ${{ !cancelled() && env.QUEUE_LITE != 'true' }}
        run: cargo test --features memory,embed-all,summarize-all,rerank-all

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: pure library (default features)
        run: cargo build --release
      - name: cli
        if: ${{ !cancelled() }}
        run: cargo build --release --features cli
      - name: serve
        if: ${{ !cancelled() }}
        run: cargo build --release --features serve
      - name: ingest
        if: ${{ !cancelled() }}
        run: cargo build --release --features memory,embed-all,summarize-all,rerank-all

  # Bit-rot guard for the benchmark crate. `default-members = ["."]` means neither
  # `cargo test` nor any lane above ever compiles `nidus-bench` — which is right (it
  # keeps the core build seconds-long) but left it silently broken for some time: a
  # `Record.vector` -> `Option<Vec<f32>>` change made every bench target fail to
  # compile, so `just bench` was dead and no performance claim was verifiable.
  # Compiling it here costs one cheap job and makes that impossible to repeat.
  #
  # Build only, never run: benchmark *timings* on a shared runner are meaningless
  # (see tests/e2e/scale.rs for the same reasoning). `duckdb`/`lancedb` stay out —
  # bundled C++ and Arrow+DataFusion are exactly the multi-minute compiles nidus
  # avoids, and they are opt-in for a human comparing engines, not for CI.
  bench-compiles:
    name: bench-compiles (bit-rot guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          components: clippy
      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
      # --features server covers the `nidus serve` engine adapter, which needs the
      # binary at runtime but must still compile here.
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: cargo clippy -p nidus-bench --all-targets --features server -- -D warnings

  # Build-thesis guard (epic nidus-54l): the off-by-default AI ingest layer must
  # not regress nidus's identity. This job asserts EMPIRICALLY, via the resolved
  # dependency graph, that:
  #   1. the DEFAULT build pulls NONE of reqwest / tokio / hyper (the async edge),
  #      so `cargo add nidus` stays the pure, seconds-fast, dep-lean sync store; and
  #   2. the ingest build's TLS is rustls + `ring` — the SAME small C+asm compile
  #      already present for ureq/redis — with NO aws-lc-sys and NO OpenSSL (the
  #      multi-minute C trees nidus exists to avoid).
  # It complements the compile-time `cfg` invariant in tests/build_thesis.rs
  # (built by the `test` job's default-features and ingest steps above). `-e no-dev` excludes
  # dev-dependencies so a test-only crate can never mask a real regression.
  build-thesis:
    name: build-thesis (dep-absence guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' }}

      - name: DEFAULT build pulls no async ingest edge
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: |
          echo "::group::default dep tree (reqwest/tokio/hyper must be absent)"
          if cargo tree -e no-dev | grep -iE '(^|[^-])(reqwest|tokio|hyper)( |$|v)'; then
            echo "::error::default build pulled an AI-ingest async-edge crate (reqwest/tokio/hyper)"
            exit 1
          fi
          echo "default build is pure: no reqwest / tokio / hyper"
          echo "::endgroup::"

      - name: ingest build uses rustls/ring, never aws-lc/OpenSSL
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: |
          echo "::group::ingest dep tree (must show rustls + ring, must NOT show aws-lc/openssl-sys)"
          tree="$(cargo tree -e no-dev --features memory,embed-all,summarize-all,rerank-all)"
          echo "$tree" | grep -iE 'reqwest|rustls|ring' | sort -u
          # Forbid the multi-minute C trees: aws-lc-sys, the OpenSSL C bindings
          # (openssl-sys / vendored openssl), and native-tls (which pulls openssl-sys
          # on Linux). NOT `openssl-probe` — that is a tiny PURE-RUST crate that only
          # locates the system cert bundle for rustls-native-certs on Linux; despite
          # the name it links no OpenSSL and compiles instantly, so it does not
          # violate the build thesis. Match the real `*-sys` offenders, not the name.
          if echo "$tree" | grep -iE 'aws-lc|openssl-sys|native-tls'; then
            echo "::error::ingest build pulled a forbidden TLS backend (aws-lc / OpenSSL-sys / native-tls)"
            exit 1
          fi
          echo "ingest TLS backend is rustls + ring only"
          echo "::endgroup::"

  # The JS SDK (sdks/js) is independent of the Rust build: typecheck, unit tests
  # (mocked fetch — no server needed), and the bundle build. The integration test
  # against a real `nidus serve` runs in `sdk-integration` below (#125).
  sdk-js:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: npm install
        working-directory: sdks/js
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: npm run typecheck
        working-directory: sdks/js
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: npm run test:unit
        working-directory: sdks/js
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: npm run build
        working-directory: sdks/js

  # The Go SDK (sdks/go) is its own module and, like the JS one, independent of the Rust
  # build: format check, vet, and the unit tests (httptest.Server — no server binary
  # needed). The `-tags integration` suite drives a real `nidus serve` and runs in
  # `sdk-integration` below (#125). There is no build step to mirror: `go test` compiles
  # the package, and a library has nothing to bundle.
  sdk-go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          go-version: "1.23"
          # go.mod, not go.sum: the SDK is standard-library only, so no go.sum exists.
          cache-dependency-path: sdks/go/go.mod
      # `gofmt -l` lists offending files but still exits 0, so a bare invocation would
      # pass silently. Test its output for emptiness instead.
      - name: gofmt
        if: ${{ env.QUEUE_LITE != 'true' }}
        working-directory: sdks/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: go vet ./...
        working-directory: sdks/go
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: go test ./...
        working-directory: sdks/go

  # The Python SDK (sdks/python), same shape as the JS job and equally independent of
  # the Rust build: lint, format check, strict mypy, and the unit tests (stub transport —
  # no server needed). The integration suite is excluded explicitly rather than left to
  # its own skip guard: skipping silently would make a genuinely broken integration test
  # look like a passing CI run. It runs in `sdk-integration` below (#125).
  #
  # 3.12 here even though the SDK's floor is 3.9 — CI proves the code is correct on a
  # current interpreter; `requires-python`/`target-version = "py39"` and ruff's UP rules
  # are what keep it from drifting past the floor.
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: pip install -e '.[dev]'
        working-directory: sdks/python
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: ruff check
        working-directory: sdks/python
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: ruff format --check
        working-directory: sdks/python
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: mypy src
        working-directory: sdks/python
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: pytest --ignore=tests/test_integration.py
        working-directory: sdks/python

  # The SDK↔server contract, on every PR (#125): build the real binary once and drive
  # all three SDKs' integration suites against it. The unit lanes above stay Rust-free
  # on purpose; this is the one job that pays the Rust build. Every suite skips itself
  # when the binary is missing, so the explicit existence check below is load-bearing —
  # without it a build-path typo would turn this whole job into a silent pass (#121
  # lived undetected in exactly that gap).
  sdk-integration:
    name: SDK integration (real server)
    runs-on: ubuntu-latest
    env:
      NIDUS_BIN: ${{ github.workspace }}/target/release/nidus
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.QUEUE_LITE != 'true' }}

      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-sdk-integration-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-integration-

      - name: Build the binary the suites drive
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: cargo build --release --features cli

      - name: Refuse to proceed without the binary (a skip must never read as a pass)
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: test -x "$NIDUS_BIN"

      - uses: actions/setup-node@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - name: JS integration
        if: ${{ env.QUEUE_LITE != 'true' }}
        working-directory: sdks/js
        run: |
          npm install
          npm run test:integration

      - uses: actions/setup-go@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          go-version: "1.23"
          cache-dependency-path: sdks/go/go.mod
      - name: Go integration
        if: ${{ env.QUEUE_LITE != 'true' }}
        working-directory: sdks/go
        run: go test -tags integration ./...

      - uses: actions/setup-python@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - name: Python integration
        if: ${{ env.QUEUE_LITE != 'true' }}
        working-directory: sdks/python
        run: |
          pip install -e '.[dev]'
          pytest tests/test_integration.py

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Miri
        if: ${{ env.QUEUE_LITE != 'true' }}
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup

      - uses: actions/cache@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-

      # nidus is pure safe Rust with zero FFI, so the whole suite runs under Miri
      # (no feature to gate out). File-backed tests that hit fsync/syscalls Miri
      # lacks carry `#[cfg_attr(miri, ignore)]`; everything else is checked.
      - name: Test with Miri
        if: ${{ env.QUEUE_LITE != 'true' }}
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-ignore-leaks"
        run: cargo miri test

  # The checker that decides which lanes a change needs and which repo laws it breaks
  # was never run by CI (#183), so every law and every selftest case was advisory. Two
  # jobs, because they answer different questions and carry different risk.

  # The detectors themselves. Pure functions over fixtures: no repository state, no
  # network, no `gh`. #179 and #182 both rest entirely on cases in here, and until now
  # nothing ran them, so a later PR could delete one and go green.
  checker-selftest:
    name: nidus-check selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          node-version: 22
      - if: ${{ env.QUEUE_LITE != 'true' }}
        run: .claude/skills/nidus/bin/nidus-check selftest

  # The laws, against the PR's own diff. Deliberately NOT `--strict`: plain `laws` exits
  # non-zero on `severity: 'error'` alone (check.mjs:100), which is the policy we want.
  # `--strict` also fails on warnings, and `stale-ticket` warns for every open issue a PR
  # merely references, so it would fail most PRs and get switched off.
  checker-laws:
    name: nidus-check laws
    # A required check must report on merge_group too, and a merge group has no PR
    # number — hence the two modes below. Still skipped on push: main's own history
    # is not a diff to hold to the laws.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      # Full history: the laws compare a merge base to a head, and a shallow clone has
      # no merge base to find.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: ${{ env.QUEUE_LITE != 'true' }}
        with:
          node-version: 22
      # `--pr` where there is one: it reads the PR's real base ref rather than assuming
      # main, and gives the ticket laws the PR body, where a `Closes` line actually lives.
      # A merge group has neither, so it falls back to the diff against its base.
      - name: Check repo laws
        if: ${{ env.QUEUE_LITE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            .claude/skills/nidus/bin/nidus-check laws --pr ${{ github.event.pull_request.number }}
          else
            base="${{ github.event.merge_group.base_ref }}"
            base="origin/${base#refs/heads/}"
            git fetch --quiet origin "${base#origin/}"
            .claude/skills/nidus/bin/nidus-check laws --base "$base"
          fi
