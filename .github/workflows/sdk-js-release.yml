name: Release JS SDK

# Publishes @duckedup/nidus to npm at the CRATE's version.
#
# ## Why the version is the crate's, and why it is stamped rather than hand-edited
#
# Every nidus SDK ships at the version of the server it was written against, so
# "which nidus does this client speak to" is answerable from the version alone. That
# makes `Cargo.toml`'s `version` the single source of truth, and `package.json`'s
# version a *derived* value — stamped here from the `version` input and committed back
# to main, exactly as `helm-publish.yml` does for the chart (nidus-yap). CLAUDE.md
# records why the alternative was abandoned: a CI assertion that the two agree fires on
# essentially every PR, because every PR bumps the crate. Deriving it makes the drift
# unrepresentable instead of merely detected.
#
# ## Why workflow_call rather than `on: push`
#
# The crate's release tag is pushed with GITHUB_TOKEN, which by GitHub's anti-recursion
# rule cannot start another workflow — the same reason docker.yml and helm-publish.yml
# are called directly by release.yml. Being invoked by release.yml also means this can
# only ever publish a version the crate actually released, which a `paths:`-filtered
# push trigger could not guarantee.
#
# Tag namespace `js-v*`, distinct from the crate's `v*`.
#
# ## The `./wasm` subpath is built and asserted here, not taken from `ci.yml`
#
# This is a separate workflow run from `ci.yml` and is also its own `workflow_dispatch`
# entry point, so it can never rely on a CI-job artifact — it must build
# `bindings/wasm/pkg` itself. The assertion (via `just verify-wasm-subpath`) runs after
# `Build` and before `Publish`, matching "verify AFTER stamping" above: the tree about
# to publish is the one that must be proven, and a silently-missing subpath is exactly
# what nidus-3hc exists to catch.

on:
  workflow_call:
    inputs:
      version:
        description: Crate version to stamp and publish (no leading v)
        required: true
        type: string
  # Manual dispatch makes THIS file the entry point, so npm validates it against a trusted
  # publisher named `sdk-js-release.yml` — not the `release.yml` the normal path needs.
  # Publishing this way needs a second trusted-publisher entry naming this file (nidus-bkt).
  workflow_dispatch:
    inputs:
      version:
        description: Crate version to stamp and publish (no leading v)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Stamp and publish to npm
    if: github.repository == 'duckedup/nidus'
    runs-on: ubuntu-latest
    permissions:
      # `write` so the stamp can be committed back — see "Persist the stamp" below.
      contents: write
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          # The branch, not the triggering SHA: this job commits the stamp back, which
          # needs a branch to push to.
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Stamp package.json version from the crate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to stamp a non-semver version: '$VERSION'" >&2; exit 1 ;;
          esac
          cd sdks/js
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "stamped sdks/js/package.json to $(node -p 'require("./package.json").version')"

      - name: Install
        working-directory: sdks/js
        run: npm ci || npm install

      # Verify AFTER stamping: the tree being published is the stamped one, so that is
      # what has to be valid (same reasoning as helm-publish re-linting post-stamp).
      - name: Typecheck
        working-directory: sdks/js
        run: npm run typecheck

      - name: Unit tests
        working-directory: sdks/js
        run: npm run test:unit

      # Same pinned toolchain subtlety as ci.yml:390-395 — `targets:` would add wasm32
      # to `stable` rather than the 1.96.0 `rust-toolchain.toml` pin, so `rustup target
      # add` is used instead. wasm-bindgen version MUST match ci.yml and
      # scripts/e2e-wasm.sh: it is keyed to Cargo.lock's `wasm-bindgen`.
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Ensure `just` is available
        run: command -v just >/dev/null 2>&1 || cargo install just --locked
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - name: Build the browser binding
        run: just build-wasm-binding

      - name: Build
        working-directory: sdks/js
        run: npm run build

      # `just verify-wasm-subpath` is the same recipe the `wasm` CI job runs, so CI and
      # a local run cannot drift. The subpath is advertised in package.json's `exports`
      # map; a failure here means the wasm build step above failed or was skipped.
      - name: Verify the wasm subpath is in the published tarball
        run: |
          set -euo pipefail
          if ! just verify-wasm-subpath; then
            echo "::error::the ./wasm subpath (dist/wasm/nidus_wasm.js, .d.ts," \
                 "nidus_wasm_bg.wasm, index.js, index.d.ts) is advertised in" \
                 "sdks/js/package.json's exports but ABSENT from the npm tarball. The" \
                 "wasm build step above likely failed or was skipped. See nidus-3hc."
            exit 1
          fi

      # Idempotent: a version already on the registry is a no-op success, not a failed
      # release — the crate's own publish step takes the same stance.
      #
      # Auth is OIDC trusted publishing, configured at npmjs.com → @duckedup/nidus →
      # Settings → Trusted Publishing (org: duckedup, repo: nidus). No NODE_AUTH_TOKEN, and
      # deliberately no token fallback: the package requires 2FA and disallows bypass
      # tokens, under which npm refuses EVERY token publish with `EOTP` (it cannot prompt
      # for an OTP in CI). A long-lived credential here could not publish and would only
      # bury the real error — OIDC is the only path, so a failure must say so and stop.
      #
      # The configured workflow MUST be `release.yml`, not this file (nidus-bkt). npm
      # validates the *entry-point* workflow under `workflow_call`, not the one holding the
      # publish, so keying it here 404'd every release from #66 to 0.53.0.
      - name: Publish
        working-directory: sdks/js
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if npm view "@duckedup/nidus@${VERSION}" version >/dev/null 2>&1; then
            echo "@duckedup/nidus ${VERSION} is already published — nothing to do"
            exit 0
          fi
          if npm publish; then
            exit 0
          fi
          # npm reports an unauthorized write as 404, not 403, which reads as "package
          # missing" and cost nidus-bkt five silent releases. Name the real cause.
          echo "::error::trusted publishing failed. A 404 on PUT means UNAUTHORIZED, not" \
               "missing: npmjs.com → @duckedup/nidus → Trusted Publishing must name the" \
               "ENTRY-POINT workflow (release.yml), not sdk-js-release.yml. See nidus-bkt."
          exit 1

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="js-v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do"
            exit 0
          fi
          PREV_TAG=$(git tag --sort=-v:refname --list 'js-v*' | head -1)
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" -- sdks/js | head -50)
          else
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD -- sdks/js)
          fi
          git tag "$TAG"
          git push origin "$TAG"

          # --latest=false so an SDK release never displaces the crate's as the
          # repository's "latest" release.
          gh release create "$TAG" \
            --title "JS SDK ${VERSION}" \
            --latest=false \
            --notes "## @duckedup/nidus ${VERSION}

          \`\`\`sh
          npm install @duckedup/nidus@${VERSION}
          \`\`\`

          ### Changes

          ${NOTES}"

      # Keep the checked-in manifest honest: without this the repo would permanently
      # disagree with what was published, and a clone would report a stale version.
      # Pushed with GITHUB_TOKEN, which cannot trigger another workflow, so no loop.
      #
      # Tolerant of the race, LOUD about branch protection — the script distinguishes
      # them. No continue-on-error: swallowing every failure is what hid #82.
      - name: Persist the stamp back to main
        run: |
          ./scripts/stamp-back.sh sdk-js "${{ inputs.version }}" \
            sdks/js/package.json sdks/js/package-lock.json
