# nidus is the workspace root AND its sole default member: `cargo build`/`cargo test`
# (and the core `just` recipes) touch ONLY nidus, keeping its pure-Rust, seconds-long
# build path intact. The benchmark crate — which pulls the heavy, FFI-laden deps nidus
# exists to avoid (bundled DuckDB C++, LanceDB/Arrow/DataFusion) — is a member built
# solely on explicit request (`-p nidus-bench`, via `just bench`).
[workspace]
members = ["benchmarks", "bindings/wasm"]
default-members = ["."]

[package]
name = "nidus"
version = "0.88.0"
edition = "2024"
rust-version = "1.96"
description = "A small, pure-Rust embeddable vector store: brute-force or ANN cosine search over a single append-only directory, with pluggable persistence (local files, S3, GCS). No SQL, no query engine; builds in seconds."
repository = "https://github.com/duckedup/nidus"
license = "MIT"
keywords = ["vector", "embeddings", "search", "embedded", "database"]
categories = ["database-implementations", "data-structures"]
# Keep the published crate lean: drop issue-tracker, agent, CI, and deploy infra.
# `docs/` and `sdks/` are excluded for the same reason — an Astro site and the
# client SDKs are separately-published artifacts (GitHub Pages, npm, PyPI, the Go
# module proxy), so shipping their sources to every `cargo add nidus` is pure weight.
exclude = [".claude/", ".github/", "AGENTS.md", "justfile", "benchmarks/", "bindings/", "charts/", "Dockerfile", ".dockerignore", "docs/", "sdks/"]

[lib]
name = "nidus"
path = "src/lib.rs"

# The `nidus` binary: the CLI plus `nidus serve`. Gated behind the non-default
# `cli` feature (see [features]) so it builds only when asked. `cargo install
# nidus --features cli` compiles it from source; `cargo binstall nidus` fetches
# a prebuilt binary (see [package.metadata.binstall]) and needs no feature flag.
[[bin]]
name = "nidus"
path = "src/bin/nidus.rs"
required-features = ["cli"]

# The all-in-one memory example (remember/recall over real providers). Gated on
# the ingest features so the default `cargo build --examples`/test path skips it.
[[example]]
name = "memory"
required-features = ["memory", "embed-all", "summarize-all"]

[features]
# Off by default — that is the whole point. With `cli` off, `cargo add nidus`
# and `cargo tree -p nidus` (`just deps`) pull NOTHING beyond the four core
# crates below, and the core build/test/Miri path stays pure and seconds-long.
# Turning it on adds the binary-only deps (all pure Rust, zero FFI).
cli = ["dep:clap", "dep:tokio", "dep:axum", "dep:tower", "dep:http-body", "dep:serde_json", "dep:tar", "dep:flate2", "dep:tempfile"]

# ── AI ingest layer (SPEC §9 / epic nidus-54l) — all OFF by default ──────────
# nidus widens from a tight vector store to an all-in-one "memory": text in,
# relevant text out. The transforms that prepare/query what's remembered —
# EMBED (optional SUMMARIZE first) — live behind these off-by-default features at
# the async edge, exactly like `cli`/`serve`. The DEFAULT build pulls NONE of
# them, so `cargo add nidus` stays the pure, seconds-fast, dependency-lean sync
# vector store. Turning them on adds `reqwest` (rustls-tls → reuses the `ring`
# already present for ureq/redis; NO new C tree, NO aws-lc/OpenSSL) + `tokio` +
# `serde_json`. `#![deny(unsafe_code)]` stays intact; Miri lanes skip this layer.
#
# `embed`/`summarize` are the base infra (traits, errors, configs, provider
# enum, the shared retry helper). Each per-provider feature enables its base and
# compiles just that adapter, so a caller pays only for the providers they use.
embed = ["dep:reqwest", "dep:tokio", "dep:serde_json"]
embed-voyage = ["embed"]
embed-openai = ["embed"]
embed-ollama = ["embed"]
embed-cohere = ["embed"]
embed-gemini = ["embed"]
embed-mistral = ["embed"]
embed-jina = ["embed"]
# Generic OpenAI-compatible embedder: one adapter whose `base_url` override
# reaches Azure OpenAI, Together, Fireworks, vLLM, LiteLLM, DeepInfra, … via the
# standard `/v1/embeddings` shape.
embed-openai-compat = ["embed"]
# Every shipped embedder at once — the "support all providers" umbrella.
embed-all = [
    "embed-voyage",
    "embed-openai",
    "embed-ollama",
    "embed-cohere",
    "embed-gemini",
    "embed-mistral",
    "embed-jina",
    "embed-openai-compat",
]

summarize = ["dep:reqwest", "dep:tokio", "dep:serde_json"]
summarize-anthropic = ["summarize"]
# OpenAI-compatible chat-completions summarizer: serves OpenAI, Azure, LiteLLM,
# vLLM, Ollama `/v1`, … via `base_url`.
summarize-openai = ["summarize"]
summarize-all = ["summarize-anthropic", "summarize-openai"]

# Hosted cross-encoder reranking (SPEC §9's rerank seam): a post-ranking stage over an
# over-fetched candidate window, never the quantized int8→f32 rescore in `src/store/quant.rs`
# (that one already used the word "rerank" first — see `src/rerank/mod.rs`). Same shape as
# `embed`/`summarize`: base infra here, one feature per adapter, no new dependency (reuses
# `reqwest`/`tokio`/`serde_json`, already optional deps of the ingest layer).
rerank = ["dep:reqwest", "dep:tokio", "dep:serde_json"]
rerank-voyage = ["rerank"]
rerank-cohere = ["rerank"]
rerank-all = ["rerank-voyage", "rerank-cohere"]

# The headline all-in-one memory surface (remember/recall). `memory` alone gives
# the Raw ingest path (embed the text); add a `summarize-*` feature for the
# summarize-then-embed mode.
memory = ["embed"]

# The MCP 2026-07-28 server surface (nidus-zm2): `nidus serve` also answers MCP at
# `/mcp`, so any MCP client can use the memory layer as agent memory with no glue code.
#
# Implies `memory` on purpose. The MCP tool surface is deliberately TEXT-NATIVE — no
# model can emit a 384-float array as a tool argument, so the raw vector routes stay
# off it and `remember`/`recall` (which embed server-side) are the point. An `mcp`
# build without `memory` could still answer `text_search`/`stats`, but it would be a
# vector store advertising itself to agents while unable to accept anything an agent
# can say. Folded into `serve` below for the same reason.
mcp = ["cli", "memory", "dep:rmcp"]

# `nidus serve` WITH the memory endpoints (server-side remember/recall over the
# HTTP API — the SDKs send text, the server embeds/summarizes). Umbrella over the
# CLI/server stack plus the full ingest layer, so the shipped binary and the JS
# SDK's server-side memory work out of the box. `cli` alone still builds a lean
# server with only the raw vector endpoints; the memory routes are `memory`-gated.
serve = ["cli", "memory", "embed-all", "summarize-all", "rerank-all", "mcp"]

# The core is four small pure-Rust crates with no C and no FFI. The S3/GCS
# persistence backends (below) add a few more — still all pure Rust except `ring`
# (ureq's TLS, a small C+asm compile) — and they are NOT feature-gated: outgrowing
# local FS for S3 is meant to be a one-line `file://`→`s3://` runtime switch, never a
# recompile. The bar is build-and-ship SPEED (whole-crate clean build stays seconds,
# ~8× under a minute — CI asserts it), not zero-C absolutism (SPEC §1, §13.6). The
# multi-minute C trees nidus exists to avoid (bundled DuckDB C++, vendored OpenSSL,
# aws-lc-sys) stay forbidden.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
crc32fast = "1"

# `Predicate::Regex` (SPEC §7.5), in the DEFAULT build. A finite-automata engine with a
# documented linear-time guarantee — no backtracking, so there is no ReDoS class to
# defend against. Pure Rust, no C, no native linking.
regex = "1"

# Required-literal extraction for the filter index (nidus-89): narrowing `Predicate::Regex`
# needs the parsed HIR, which `regex` does not re-export. Already compiled in this tree —
# both `regex` and `regex-automata` depend on it — so a direct dep adds no build time.
regex-syntax = "0.8"

# `http` is the request-type crate shared by the (native-only, see below) S3/GCS
# backend construction AND by `embed`/`server` — it compiles for wasm32, so it stays
# unconditional here rather than moving to the wasm-excluded table below.
http = "1"

# Storage-backend deps (SPEC §13), in the DEFAULT (native) build only — see the
# `cfg(not(target_family = "wasm"))` table below. The cloud clients are sans-IO
# (build + sign requests; no transport, no async) — `rusty-s3` (Sigv4 = pure
# RustCrypto HMAC) and `tame-gcs`/`tame-oauth` (GCS + OAuth2 service-account JWT) —
# executed over `ureq`, a small blocking HTTP client whose default TLS is
# rustls + `ring` (self-contained via webpki-roots; NOT aws-lc, NOT OpenSSL). `url`
# is their request type, surfaced for backend construction.
#
# The shared MEMORY TIER over Redis (SPEC §13.3) is native-only for the same reason:
# `redis-rs` blocking client covers Redis, Valkey, KeyDB, and DragonflyDB — all
# RESP-protocol-compatible — selected by `redis://`/`rediss://`/`valkey://`/… URL
# scheme. `default-features = false` keeps it SYNC (no tokio/async pulled). Extras:
# `tls-rustls` for `rediss://` (reuses the rustls + `ring` already present for ureq —
# NOT aws-lc, NOT a second TLS stack) and `cluster` for Redis/Valkey Cluster (slot
# routing + MOVED/ASK), whose only added deps are `crc16` + `rand` — tiny, pure Rust.
#
# None of `ureq`/`tame-oauth`/`redis` compile for wasm32 (network + threads), so
# `rusty-s3`/`tame-gcs`/`tame-oauth`/`ureq`/`url`/`redis` move to the wasm-excluded
# table below (§ "wasm32 target" near the end of this file); `url` moves with them
# because it is used only by `backend/aws_creds.rs` and `backend/s3.rs`, both gated
# out for wasm (see `src/backend/mod.rs`).

# Memory-mapped immutable segments (SPEC §9 / §14.6 phase 3), in the DEFAULT build.
# `memmap2` is the one conscious FFI/`unsafe` opt-in in nidus — a thin, fast-compiling
# wrapper over the platform `mmap` syscall (no C to build, no heavy toolchain). It lets a
# store hold its cold sealed segments mapped from disk instead of resident in RAM (`Config::mmap`,
# default off → unchanged all-RAM behaviour). `bytemuck` does the one zero-copy little-endian
# `&[u8]` → `&[f32]` reinterpret *safely* (an alignment-checked cast, no extra `unsafe`), so the
# crate's only `unsafe` is the single `Mmap::map` call (see `src/data/mmap.rs`). The crate is
# `#![deny(unsafe_code)]` with that one scoped `#[allow]`; everything else stays unsafe-free.
memmap2 = "0.9"
bytemuck = "1"

# Binary-only deps — compiled ONLY under `--features cli`, never by library
# consumers. All pure Rust (no `*-sys`, no bundled C): clap for the CLI, and the
# tokio/axum/tower stack for `nidus serve`. `nidus serve` wraps the synchronous
# `Nidus` in `Arc<Mutex<…>>` + `spawn_blocking` — the exact async pattern the
# README/CLAUDE.md prescribe for async callers.
clap = { version = "4", features = ["derive", "env"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
# The `http_body::Body` trait, so the server can wrap a request body in a per-frame
# idle timeout (nidus-6c2). NOT a new dependency in any sense that costs anything:
# axum 0.8 already depends on this exact version, so it is compiled either way — this
# line only makes the trait nameable. `cli`-gated like the rest of the binary's deps.
http-body = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# Backup/restore archiving. Both pure Rust, zero FFI: `tar` is std-only, and
# `flate2` is pinned to its `rust_backend` (miniz_oxide) — never a `*-sys`/C
# zlib. cli-feature-only, so the pure-`cargo add nidus` tree is untouched.
tar = { version = "0.4", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
# `backup::verify`'s scratch extraction dir. cli-feature-only; kept in
# [dev-dependencies] too so existing test-only uses need no change.
tempfile = { version = "3", optional = true }

# The MCP 2026-07-28 server surface (nidus-zm2), `mcp`-gated. Pure Rust, no FFI: 27
# crates marginal over the existing `cli` tree of 163, ~4.3s of cold build, and the
# DEFAULT library build is untouched — so `cargo add nidus`, `just deps`, and the
# build-thesis dep-absence guard are unaffected by construction.
#
# Taken rather than hand-rolled deliberately. The 2026-07-28 core is small enough to
# hand-roll (stateless JSON-RPC dispatch over one POST route), and `crc.rs`/`auth.rs`
# set the precedent for hand-rolling small things. But those are FROZEN specs; MCP has
# revised three times in eighteen months and now ships a formal twelve-month
# deprecation treadmill. The part that survives 2.0 is the version matrix
# (`ProtocolVersion::KNOWN_VERSIONS`, negotiating `initialize` down for older peers,
# per-version required-`_meta` validation, clearing `resultType` for pre-2.0 clients),
# and hand-rolling that means either 2.0-only — talking to almost no client deployed
# today — or reimplementing the sessions and SSE that 2.0 removed from the spec but
# not from reality. Pinned tight: four releases in the nine days after the spec landed.
#
# Only the server half is compiled: no client, no reqwest, no OAuth. "No child-process
# transport" means rmcp's client-side spawn transport, not compiled here — the two server
# transports below are streamable-HTTP and stdio; schemas stay hand-written (`server/mcp/`).
rmcp = { version = "=3.1.1", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "transport-io",
], optional = true }

# AI-ingest-only dep — compiled ONLY under the `embed`/`summarize` features,
# never by default library consumers. `default-features = false` + `rustls-tls`
# reuses the rustls + `ring` TLS already pulled by ureq/redis (NOT aws-lc, NOT
# OpenSSL — no new C tree); `json` gives typed request/response bodies.
# Embeddings/summaries are single-shot request/response, so NO `stream` feature.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Storage-backend + memory-tier deps that do not compile for wasm32 (network + threads):
# `rusty-s3`/`tame-gcs`/`tame-oauth` (S3/GCS clients) run over `ureq`; `url` is their
# request type, used only by `backend/aws_creds.rs`/`backend/s3.rs`; `redis` is the
# Redis-family memory tier. All gated out for wasm in `src/backend/mod.rs`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusty-s3 = "0.9"
tame-gcs = "0.14"
tame-oauth = "0.10"
ureq = "3"
url = "2"
redis = { version = "1", default-features = false, features = ["tls-rustls", "cluster"] }

# wasm32 target (browser / edge, nidus-y67). Measured cost: 10s cold, 33 crates,
# wasm target only — the native dependency graph above is byte-identical, so
# `build-budget` and `build-thesis` are unaffected.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
# `js-sys` only: the OPFS handle is reached via `Reflect` on an opaque `JsValue`, so no
# typed `web-sys` binding (and none of its feature list) is needed anywhere.
js-sys = "0.3"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# Dev-dependency only (test-crate use, nidus-21z): the shipped wasm graph above is
# unchanged. Already present transitively at 0.4.72, matching the pinned wasm-bindgen 0.2.122.
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tempfile = "3"

# Prebuilt-binary fetch for `cargo binstall nidus`. The crate is named `nidus` but
# the release assets are `nidus-<target>.tar.gz` (`.zip` on Windows), each holding
# the bare `nidus` binary at the archive root — so the URL and bin-dir are explicit.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nidus-{ target }{ archive-suffix }"
bin-dir = "nidus{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
codegen-units = 1

# The wasm binding only (nidus-y67). A browser pays for every byte and the binding exposes
# the whole surface, so nothing is dead-code-eliminated. Size over speed — kept off
# `[profile.release]` because the native library trades the other way (SPEC §1, Speed).
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
